# nginx/default.conf — desarrollo local
# ─────────────────────────────────────────────────────────────────────────────
# Nginx actúa como reverse proxy único en el puerto 80, separando el tráfico
# entre el backend Go (API, bajo /v1) y el frontend React/Vite (todo lo demás).
# Mismo patrón que el proyecto de Bold, adaptado a esta API más simple —
# acá basta un solo location ^~ /v1/ en vez de listar cada ruta una por una,
# porque TODAS las rutas del backend cuelgan de ese prefijo (ver routes.go).
# ─────────────────────────────────────────────────────────────────────────────

# WebSocket condicional: solo activa "Connection: upgrade" si el cliente lo
# pide (necesario para el HMR de Vite), evitando mandarlo en requests normales.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name localhost;
    server_tokens off;

    # ── Cabeceras de seguridad HTTP ──────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # CSP más permisiva en dev porque Vite inyecta scripts/estilos inline y
    # usa WebSocket para HMR. En producción el frontend no pasa por acá
    # (ver default.conf.prod), así que no hace falta endurecerla aquí.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:*; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self';"
        always;

    # ── Backend Go — toda la API cuelga de /v1 ───────────────────────────────
    location ^~ /v1/ {
        proxy_pass http://api:8000;
        include /etc/nginx/proxy_params.conf;
    }

    # ── Frontend React (Vite dev server) — todo lo demás ─────────────────────
    location / {
        proxy_pass http://web:5173;
        proxy_set_header Host              localhost;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Necesario para el WebSocket de Hot Module Replacement de Vite.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}