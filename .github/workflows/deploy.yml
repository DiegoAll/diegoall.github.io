name: Deploy React Frontend to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install
        working-directory: ./frontend

      - name: Build Project
        run: npm run build
        working-directory: ./frontend
        env:
          # VITE_API_URL: http://34.26.185.107
          VITE_API_URL: https://34-26-185-107.sslip.io

      # GitHub Pages es un servidor de archivos estáticos: si alguien entra
      # directo a una ruta de React Router (ej. /blog, /highlights) que no
      # corresponde a un archivo real, devuelve 404 sin saber que React
      # debería manejarla. Copiar index.html como 404.html hace que GitHub
      # Pages sirva la app completa ante cualquier ruta no encontrada, y una
      # vez cargado el JS, React Router toma el control y muestra la página
      # correcta según la URL real del navegador.
      - name: Copiar index.html como 404.html (fallback para rutas de React Router)
        run: cp dist/index.html dist/404.html
        working-directory: ./frontend

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4